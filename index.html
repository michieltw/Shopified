<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackout Hockey - Configurator</title>
    <!-- Using Tailwind via CDN for quick prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-white antialiased">

    <div class="flex flex-col lg:flex-row min-h-screen">

        <!-- Left Side: Visualizer -->
        <div class="w-full lg:w-1/2 visualizer-container border-b lg:border-b-0 lg:border-r border-gray-800">
            <!-- Layers will be dynamically updated by JS -->
            <img id="layer-base" src="assets/images (1).png" class="stick-layer" style="z-index: 1;" alt="Base Stick">
            <img id="layer-texture" src="" class="stick-layer hidden" style="z-index: 2;" alt="Stick Texture">

            <div class="absolute top-4 left-4 z-10">
                <img src="assets/Blackout_White_on_Black.png" alt="Blackout Hockey" class="h-6 opacity-70">
            </div>

            <div class="absolute top-4 right-4 z-10">
                <button id="btn-advice" class="text-xs uppercase tracking-widest text-gray-400 hover:text-white underline">Ask for Advice</button>
            </div>
        </div>

        <!-- Right Side: Options Panel -->
        <div class="w-full lg:w-1/2 options-panel lg:h-screen lg:overflow-y-auto p-6">
            <div class="max-w-xl mx-auto">
                <h1 class="text-3xl font-bold mb-2">Build Your Stick</h1>
                <p class="text-gray-400 mb-8 text-sm">Select your options below. Changes update in real-time.</p>

                <div id="options-container" class="space-y-2">
                    <!-- Options injected here by script.js -->
                </div>

                <!-- Read-only stats block (Mock) -->
                <div class="mt-12 p-6 bg-gray-900 rounded-lg border border-gray-800">
                    <h3 class="text-lg font-bold mb-4">Performance Estimate</h3>
                    <div class="space-y-3">
                        <div>
                            <div class="flex justify-between text-xs mb-1"><span class="uppercase">Power</span><span>85%</span></div>
                            <div class="h-1 bg-gray-700 rounded"><div class="h-1 bg-white rounded" style="width: 85%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1"><span class="uppercase">Quick Release</span><span>92%</span></div>
                            <div class="h-1 bg-gray-700 rounded"><div class="h-1 bg-white rounded" style="width: 92%"></div></div>
                        </div>
                        <div class="text-xs text-gray-400 mt-4 pt-4 border-t border-gray-800">
                            Estimated Delivery: 2-4 Weeks
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Footer (Mobile & Desktop) -->
    <div class="sticky-footer flex-col sm:flex-row gap-4">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button id="btn-overview" class="text-sm uppercase tracking-wide border border-gray-600 px-4 py-2 rounded hover:bg-gray-800 transition">Overview</button>
            <div class="text-xl font-bold ml-auto sm:ml-0" id="total-price">€200.00</div>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button id="btn-pdf" class="flex-1 sm:flex-none text-sm uppercase tracking-wide bg-gray-800 text-white px-6 py-3 rounded font-bold hover:bg-gray-700 transition">Get PDF</button>
            <button id="btn-checkout" class="flex-1 sm:flex-none text-sm uppercase tracking-wide bg-white text-black px-8 py-3 rounded font-bold hover:bg-gray-200 transition">Checkout</button>
        </div>
    </div>

    <!-- Modals (Hidden by default) -->
    <div id="overview-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-[100] flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto relative">
            <button id="close-overview" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4">Build Summary</h2>
            <div class="mb-4">
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Unique Build Code</p>
                <div class="bg-black p-3 rounded border border-gray-800 text-sm font-mono break-all" id="build-code-display"></div>
            </div>
            <ul id="summary-list" class="space-y-2 text-sm text-gray-300">
                <!-- Summary injected here -->
            </ul>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
